# /etc/nginx/sites-available/privateapi.quotexlive.pro
# Reverse proxy: https://privateapi.quotexlive.pro  ->  127.0.0.1:8000
# Supports WebSocket upgrade for /ws and /public-otc/ws.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name privateapi.quotexlive.pro;

    # certbot --nginx will add the 443/SSL block + redirect automatically.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived live-chart sockets: don't cut them after 60s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
